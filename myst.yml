# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: c76d1b0d-663b-4106-8bc4-c7926e2040b4
  title: Matemáticas Aplicadas II
  description: "Material interactivo y reproducible para el curso Matemáticas Aplicadas II de la Universidad Icesi."
  keywords:
    - matematicas
    - aplicadas
    - jupyter-book
    - modelacion
    - python
    - docencia
  authors:
    - name: "Editores: Angela Villota y Aníbal Sosa"
  settings:
    output_matplotlib_strings: remove
  # Template repository. When creating a course from this template,
  # change this URL to the new course repository.
  github: https://github.com/Icesi-MA/Matematicas-Aplicadas-II
  jupyter:
    binder:
      # Template Binder repository. When creating a course from this template,
      # change this value to "owner/repository" for the new course.
      repo: Icesi-MA/Matematicas-Aplicadas-II
      ref: main
  toc:
    - file: README.md
    - title: "Unidad 1: Técnicas de integración, ecuaciones diferenciales separables"
      children:
        - file: "Notebooks/MA_II-nb1.ipynb"
        - file: Entregas/MA_II-Entrega_1.ipynb
        - file: "Notebooks/MA_II-nb2.ipynb"
        - file: Entregas/MA_II-Entrega_2.ipynb
        - file: "Notebooks/MA_II-nb3.ipynb"
        - file: Entregas/MA_II-Entrega_3.ipynb
    - title: "Unidad 2: Vectores, matrices y funciones de varias variables"
      children:
        - file: "Notebooks/MA_II-nb4.ipynb"
        - file: Entregas/MA_II-Entrega_4.ipynb
        - file: "Notebooks/MA_II-nb5.ipynb"
        - file: Entregas/MA_II-Entrega_5.ipynb
    - title: "Unidad 3: Operadores diferenciales en varias variables"
      children:
        - file: "Notebooks/MA_II-nb6.ipynb"
        - file: Entregas/MA_II-Entrega_6.ipynb
        - file: "Notebooks/MA_II-nb7.ipynb"
        - file: Entregas/MA_II-Entrega_7.ipynb
        - file: "Notebooks/MA_II-nb8.ipynb"
        - file: Entregas/MA_II-Entrega_8.ipynb
 
site:
  template: book-theme
  options:
    logo: _static/icesi-logo.svg
    logo_dark: _static/icesi-logo-dark.svg
    logo_text: Matemáticas Aplicadas II
    logo_url: https://www.icesi.edu.co/
    logo_alt: Universidad Icesi
    style: _static/icesi.css
